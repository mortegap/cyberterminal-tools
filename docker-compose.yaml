# NETRUNNER TERMINAL - Docker Compose Configuration
# Run with: docker-compose up --build

services:
  netrunner-terminal:
    build: .
    container_name: cyberterminal
    ports:
      - "8083:80"
    volumes:
      # GM content, editable live without rebuilding the image
      - ./data:/usr/share/nginx/html/data:ro
    restart: unless-stopped
