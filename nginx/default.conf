# EDGERUNNER TERMINAL - nginx site configuration
# Players connect over plain http on the LAN, so caching is tuned to make
# sure they always run the current build and see live GM edits.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Compress text assets (JS/CSS/JSON are most of the payload)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # App shell and GM data: always revalidate (cheap 304 when unchanged),
    # so a rebuilt image or an edited data/*.json is picked up immediately
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }

    # Self-hosted fonts never change between builds
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
